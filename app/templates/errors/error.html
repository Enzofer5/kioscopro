{% extends "base.html" if current_user.is_authenticated else "auth/base_auth.html" %}
{% from "partials/macros.html" import icon %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="code">{{ codigo }}</div>
    <h1 class="mt-1">{{ titulo }}</h1>
    <p class="muted mt-1">{{ mensaje }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-1">{{ icon('house','sm') }} Ir al inicio</a>
  </div>
</div>
{% endblock %}

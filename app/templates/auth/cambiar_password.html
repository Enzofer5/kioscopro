{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Cambiar contraseña</h1><p>Al cambiarla se cierran tus sesiones abiertas en otros dispositivos.</p></div></div>
<div class="card" style="max-width:520px">
  <form method="post" class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field col-12"><label class="req" for="actual">Contraseña actual</label><input type="password" id="actual" name="actual" required autocomplete="current-password"></div>
      <div class="field col-12"><label class="req" for="password">Nueva contraseña</label><input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"><span class="hint">Mínimo 8 caracteres, con letras y números.</span></div>
      <div class="field col-12"><label class="req" for="password2">Repetir nueva contraseña</label><input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password"></div>
    </div>
    <div class="form-actions"><button class="btn btn-primary" type="submit">Actualizar contraseña</button></div>
  </form>
</div>
{% endblock %}
